  <text x="26.0" y="195.5" fill="#8b949e" font-size="14.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="400" xml:space="preserve">  └  prompt: &quot;a red bicycle on a white background&quot;</text>
