  <text x="26.0" y="80.5" fill="#ffffff" font-size="14.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="600" xml:space="preserve">&gt; draw me a red bicycle on a white background, 16:9</text>
